# Sample nginx site for the MVS 3.8J bundle (scripts/bundle.sh --precompress -> dist/). See docs/DEPLOY.md.
# Put this file in /etc/nginx/conf.d/ (it is included inside http {}). Tested with nginx 1.24 (Ubuntu 24.04)
# on 127.0.0.1 by an internal (unpublished) test script (TLS lines removed for the test).
#
# Needs: HTTPS (SharedArrayBuffer and the service worker need a secure context; http://localhost is one),
# COOP/COEP/CORP on every response (the page must be cross-origin isolated), application/wasm (in nginx's
# mime.types since 1.21), immutable caching for the content-hashed dirs, no-cache for the entry files.
# Range requests work by default (the page does not need them).

# Cache-Control by path: the content-hashed dirs never change; index.html, entry.json and
# coi-serviceworker.js (fixed names) are revalidated on every load. Set in one place, because an
# add_header inside a location drops all add_header lines of the server block.
map $uri $mvs_cache_control {
    ~^/(assets|runtime|conf|boot|dasd)/   "public, max-age=31536000, immutable";
    default                               "no-cache";
}

server {
    listen 443 ssl;
    http2 on;
    server_name mvs.example.org;
    ssl_certificate     /etc/ssl/mvs/fullchain.pem;
    ssl_certificate_key /etc/ssl/mvs/privkey.pem;

    root /srv/mvs/dist;
    index index.html;

    add_header Cross-Origin-Opener-Policy   "same-origin"        always;
    add_header Cross-Origin-Embedder-Policy "require-corp"       always;
    add_header Cross-Origin-Resource-Policy "same-origin"        always;
    add_header X-Content-Type-Options       "nosniff"            always;
    add_header Cache-Control                $mvs_cache_control   always;

    # precompressed siblings from bundle.sh --precompress (<file>.gz); on the fly for the rest
    gzip_static on;
    # brotli_static on;      # needs the ngx_brotli module (not in Ubuntu's nginx); <file>.br is in the bundle
    gzip on;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/wasm text/css text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
    # the DASD chunks (dasd/c/<sha256>) have no extension
    location /dasd/c/ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
    # files for other hosts, not needed here
    location = /_headers  { return 404; }
    location = /.nojekyll { return 404; }
    error_page 404 /404.html;
}
